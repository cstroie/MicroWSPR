[env]
monitor_speed = 115200

lib_deps =
  etherkit/Etherkit Si5351@^2.2.0
  etherkit/Etherkit JTEncode@^1.3.1
  mikalhart/TinyGPS

build_flags =
  -DDEBUG
  -DUSE_SI5351
  -DCALLSIGN='"YO9JAZ"'
  -DDBM=10
  -DDECIMATION=1
  -DCALIBRATION=67760

[env:nano]
platform      = atmelavr
board         = nanoatmega328
framework     = arduino
upload_speed  = 57600

[env:nano_new]
platform      = atmelavr
board         = nanoatmega328new
framework     = arduino
upload_speed  = 115200
